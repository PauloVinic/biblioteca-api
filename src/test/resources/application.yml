spring:
  datasource:
    url: jdbc:h2:mem:biblioteca;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  sql:
    init:
      mode: never
