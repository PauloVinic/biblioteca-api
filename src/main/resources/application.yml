spring:
  application:
    name: biblioteca-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Sao_Paulo
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  sql:
    init:
      mode: always
      platform: postgresql

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/biblioteca
    username: postgres
    password: postgres

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
